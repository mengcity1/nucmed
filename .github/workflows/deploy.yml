name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 也可手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .        # ★ 仓库根就是 web/ 的内容（见 DEPLOY.md §4）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # ★ base 必须与 Pages 路径一致：
      #   - 仓库名 <user>.github.io  → VITE_BASE 留空（默认 "/"）
      #   - 仓库名其它（项目站）      → VITE_BASE=/<仓库名>/
      #   下面用 github.event.repository.name 自动取值；
      #   若你的仓库名是 <user>.github.io，把这两行 env 注释掉即可。
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify 404 fallback exists
        run: test -f dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
