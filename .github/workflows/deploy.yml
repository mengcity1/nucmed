name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 也可手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .        # ★ 仓库根就是 web/ 的内容（见 DEPLOY.md §4）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # ★ 2026-11-05：图表配色/点径自动门（scripts/check_chart_theme.py）
      #   2026-11-05 一天内同一张图因配色返工 4 次（深色点看不见 / 点被放大成"误差条" /
      #   浅色网格线淡到测不出 / 又一次补强），全靠 owner 截图发现 ⇒ 把判据固化：
      #   点径与折线点径跨主题必须相等、pointStyle 不得有光晕、数据色 ≥3:1、
      #   网格线亮度差 ∈[6,28]/255、图例/tooltip 文字 ≥4.5:1。
      - name: Check chart theme tokens
        run: python3 scripts/check_chart_theme.py

      - name: Check chart theme — negative test
        run: python3 scripts/check_chart_theme.py --self-test

      # ★ 2026-11-05（批次 A）：选中态可见性 + 样式膨胀棘轮
      #   见 docs/ui_style_consolidation_20261105.md 第六节。挡的是"选中态只剩淡渐变"、
      #   "用 bg-brand 表达选中（会被玻璃规则 !important 洗掉）"、以及 !important/规则块继续膨胀。
      - name: Check UI tokens
        run: python3 scripts/check_ui_tokens.py

      - name: Check UI tokens — negative test
        run: python3 scripts/check_ui_tokens.py --self-test

      # ★ base 必须与 Pages 路径一致：
      #   - 仓库名 <user>.github.io  → VITE_BASE 留空（默认 "/"）
      #   - 仓库名其它（项目站）      → VITE_BASE=/<仓库名>/
      #   下面用 github.event.repository.name 自动取值；
      #   若你的仓库名是 <user>.github.io，把这两行 env 注释掉即可。
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify 404 fallback exists
        run: test -f dist/404.html

      # 页面级对比度门（v59）：4 页 × 深浅，任何"直接含文字的元素"< 4.5:1 即失败。
      # 基线是 0（2026-11-05 修掉 badge-c / 已上市胶囊后），所以可以直接当硬门用。
      # ⚠ 必须另建一份 `VITE_BASE=/` 的产物：Pages 产物里的资源是 `/nucmed/assets/…`，
      #   直接在根路径静态服务会 404 ⇒ 应用起不来（2026-11-05 首次接入时就是这样红的）。
      - name: Contrast audit (WCAG AA)
        run: |
          npx playwright install --with-deps chromium
          VITE_BASE=/ npx vite build --outDir dist-audit --emptyOutDir
          npx --yes serve -s dist-audit -l 4175 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4175 >/dev/null && break; sleep 1; done
          node scripts/ui_contrast_audit.mjs --base http://127.0.0.1:4175

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
